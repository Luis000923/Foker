schema_version: 1
name: write-tests
version: 1.0.0
purpose: Añade tests Vitest que demuestran regresiones mediante fail-to-pass.
triggers:
  keywords: [write-tests, pruebas]
constraints:
  - Respetar el alcance y las rutas protegidas
  - No ejecutar scripts de skills ni ampliar permisos
tools: [foker_task_begin, foker_context, foker_check, foker_task_submit]
workflow_ref: SKILL.md#procedimiento
validation:
  checks: [typecheck, lint, test]
outputs:
  - kind: modified_files
    within_scope: true
  - kind: tests
    within_scope: true
permissions:
  network: false
