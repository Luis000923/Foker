name: Nightly

# FKR-081 (FOKER-SPEC §21.2): matriz completa, property tests ampliados y rendimiento.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: 22.14.0 }
          - { os: ubuntu-24.04, node: 24 }
          - { os: ubuntu-24.04, node: 26 }
          - { os: ubuntu-24.04-arm, node: 22.14.0 }
          - { os: macos-15, node: 22.14.0 }
          - { os: macos-15-intel, node: 22.14.0 }
          - { os: windows-2025, node: 22.14.0 }
          - { os: windows-11-arm, node: 22.14.0 }
    runs-on: ${{ matrix.os }}
    container: ${{ startsWith(matrix.os, 'ubuntu') && 'rust:1.98.0-bookworm' || '' }}
    timeout-minutes: 60
    env:
      PROPTEST_CASES: '1000'
    steps:
      - name: Finales de línea LF en Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Toolchain de Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-nextest
      - run: pnpm install --frozen-lockfile
      - name: Tests Rust (property tests ampliados)
        run: cargo nextest run --workspace --locked --profile ci
      - run: pnpm build:native
      - run: pnpm build
      - name: Tests TypeScript
        run: pnpm test:ts

  coverage:
    name: cobertura de líneas (mínimo 80 %)
    runs-on: ubuntu-24.04
    container:
      image: rust:1.98.0-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
      - name: Toolchain de Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - name: Preparar dependencias para los scripts offline
        run: cargo fetch --locked
      - name: Cobertura Rust por crate
        run: pnpm coverage:rs
      - name: Cobertura TypeScript por paquete
        run: pnpm coverage:ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cobertura-${{ github.run_id }}
          path: coverage/
          retention-days: 30

  performance:
    name: rendimiento (large-10k)
    runs-on: ubuntu-24.04
    container:
      image: rust:1.98.0-bookworm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
      - name: Toolchain de Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-nextest
      - name: Mediciones
        run: >-
          cargo nextest run --workspace --locked --release --run-ignored only
          -E 'binary(perf_large)' --no-capture 2>&1 | tee perf.txt
      - name: Comparar con la referencia (regresión > 20 %)
        run: node scripts/perf-check.mjs perf.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-${{ github.run_id }}
          path: perf.txt
          retention-days: 30

  report-regression:
    name: abrir issue de regresión
    needs: performance
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Crear issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh issue create --title "Regresión de rendimiento en nightly"
          --body "La comparación con benchmarks/perf-baseline.json superó el 20 %. Ejecución: $RUN_URL"
