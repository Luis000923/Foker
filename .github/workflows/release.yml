name: Release

# FKR-006: construye el addon para los 6 targets del MVP y prueba cada artefacto empaquetado en su
# runner nativo. La publicación en npm llega con FKR-080; hoy el workflow nunca publica.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Construir y probar sin publicar (única opción hasta FKR-080)
        type: boolean
        default: true
  pull_request:
    paths:
      - crates/**
      - packages/core/**
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/smoke-native.mjs
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            cross: --use-napi-cross
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            cross: --use-napi-cross
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    container: ${{ startsWith(matrix.os, 'ubuntu') && 'rust:1.98.0-bookworm' || '' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm
      - name: Toolchain y target de Rust
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Compilar addon
        working-directory: packages/core
        run: >-
          pnpm exec napi build --platform --release --target ${{ matrix.target }} ${{ matrix.cross }}
          --manifest-path ../../crates/foker-napi/Cargo.toml --output-dir ../../target/napi-out --no-js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: addon-${{ matrix.target }}
          path: target/napi-out/*.node
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke (${{ matrix.target }} en ${{ matrix.runner }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ startsWith(matrix.runner, 'ubuntu') && 'rust:1.98.0-bookworm' || '' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compilar @foker/core (TS)
        run: pnpm --filter @foker/core run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: addon-${{ matrix.target }}
          path: target/napi-out
      - name: Instalar tarballs y ejecutar versionInfo()
        run: node scripts/smoke-native.mjs ${{ matrix.target }} target/napi-out
