[workspace]
resolver = "3"
members = ["crates/foker-map", "crates/foker-context", "crates/foker-napi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
foker-map = { path = "crates/foker-map" }
foker-context = { path = "crates/foker-context" }
blake3 = "1.8.7"
fd-lock = "4.0.4"
globset = "0.4.20"
ignore = "0.4.33"
libm = "0.2.16"
oxc_resolver = "11.24.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tree-sitter = "0.27.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
unicode-normalization = "0.1.25"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
